<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Minecraft Present Simple Miner</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            background: #000;
            cursor: crosshair;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
        }
        html, body { height: 100%; }
        @media (hover: hover) and (pointer: fine) {
            body { cursor: url('img/pickaxe.png') 32 32, crosshair; }
        }
        #game-stage {
            width: 100%; height: 100vh; height: 100dvh;
            background: url('img/bg1.jpg') no-repeat center center;
            background-size: cover;
            position: relative;
            transition: background-image 0.8s ease-in-out;
        }
        .ui {
            position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); left: calc(12px + env(safe-area-inset-left, 0px));
            color: #fff; text-shadow: 2px 2px #000;
            background: rgba(0,0,0,0.8); padding: 12px 16px;
            border: 3px solid #f39c12; border-radius: 4px;
            z-index: 1000; min-width: 180px;
            font-size: clamp(13px, 2.5vw, 18px);
            line-height: 1.6;
        }
        #next-lvl-btn {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            padding: clamp(14px, 3vw, 30px) clamp(28px, 6vw, 70px);
            font-size: clamp(22px, 5vw, 50px);
            font-family: 'Courier New', Courier, monospace;
            background: #f39c12; color: white;
            border: 5px solid #a6611a; cursor: pointer;
            display: none; z-index: 2000;
            text-shadow: 2px 2px #000;
        }
        .chest {
            width: var(--cw, 160px);
            height: var(--cw, 160px);
            position: absolute;
            background: url('img/chest.png') no-repeat center center;
            background-size: contain;
            display: flex; align-items: center; justify-content: center;
            text-align: center;
            z-index: 500;
            animation: floatSpawn var(--life, 7.5s) ease-in-out forwards;
        }
        .chest-text {
            pointer-events: none;
            margin-top: -10px;
            padding: 4px 8px;
            font-weight: 900;
            font-size: clamp(12px, calc(var(--cw, 160px) * 0.125), 26px);
            color: #fff;
            text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
            line-height: 1.2;
        }
        @keyframes floatSpawn {
            0%   { transform: scale(0); opacity: 0; }
            10%  { transform: scale(1); opacity: 1; }
            90%  { transform: scale(1); opacity: 1; }
            100% { transform: scale(0); opacity: 0; }
        }
        .tnt-explosion {
            background: url('img/tnt.png') no-repeat center center !important;
            background-size: contain !important;
            animation: tntShake 0.1s infinite !important;
            z-index: 600;
        }
        @keyframes tntShake {
            0%  { transform: scale(1.3) translate(5px, 5px); }
            50% { transform: scale(1.3) translate(-5px, -5px); }
        }
        .shake-screen { animation: screenShake 0.4s; }
        @keyframes screenShake {
            25%  { transform: translate(10px, 10px); }
            50%  { transform: translate(-10px, -10px); }
            100% { transform: translate(0,0); }
        }
        .win-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: url('img/win.jpg') no-repeat center center;
            background-size: cover;
            display: none; flex-direction: column; align-items: center; justify-content: center;
            z-index: 3000;
        }
        .win-screen h1 {
            color: #ffff55;
            font-size: clamp(28px, 6vw, 60px);
            text-shadow: 4px 4px #000;
            text-align: center;
            padding: 0 16px;
        }
        .win-screen button, .mode-btn {
            padding: clamp(10px,2vw,20px) clamp(20px,4vw,40px);
            font-size: clamp(16px,3vw,24px);
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
            background: #f39c12; border: 4px solid #a6611a; color: #fff;
            text-shadow: 2px 2px #000; margin-top: 20px;
        }
        .mode-btn { width: min(80vw, 420px); margin-top: 12px; }
        .mode-btn:hover { background: #e67e22; }

        /* Меню выбора режима */
        #mode-menu {
            position: absolute; inset: 0; z-index: 4000;
            background: rgba(0,0,0,0.88);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            justify-content: safe center;
            overflow-y: auto; padding: 16px;
        }
        #mode-menu h1 {
            color: #f1c40f; text-shadow: 3px 3px #000;
            font-size: clamp(22px, 5vw, 44px);
            text-align: center; margin: 0 0 4px;
        }
        #mode-menu p { color: #fff; margin: 0 0 8px; text-align: center; font-size: clamp(13px, 2.5vw, 20px); }

        #level-banner {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: rgba(0,0,0,0.85);
            border: 5px solid #f39c12; border-radius: 6px;
            color: #f1c40f; text-align: center; padding: 30px 50px;
            font-size: clamp(24px, 5vw, 52px);
            text-shadow: 3px 3px #000;
            z-index: 2500;
            transition: transform 0.3s;
            pointer-events: none;
        }
        #level-banner.show { transform: translate(-50%, -50%) scale(1); }
        #level-banner .sub { font-size: clamp(14px, 2.5vw, 26px); color: #fff; margin-top: 8px; }

        #popup {
            position: absolute; left: 50%; top: 18%;
            transform: translate(-50%, 0); opacity: 0;
            font-size: clamp(20px, 5vw, 44px); font-weight: 900;
            color: #ff5577; text-shadow: 3px 3px #000;
            z-index: 2800; pointer-events: none; white-space: nowrap;
        }
        #popup.show { animation: popupAnim 1.6s ease-out; }
        @keyframes popupAnim {
            0%   { opacity: 0; transform: translate(-50%, 20px) scale(0.6); }
            20%  { opacity: 1; transform: translate(-50%, 0) scale(1.1); }
            80%  { opacity: 1; transform: translate(-50%, -10px) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -30px) scale(1); }
        }

        /* Мобильные и маленькие экраны */
        @media (max-width: 700px), (max-height: 500px) {
            .ui { padding: 6px 10px; min-width: 0; border-width: 2px; line-height: 1.35; font-size: clamp(11px, 3vw, 14px); }
            #level-banner { padding: 16px 24px; width: 90%; }
            .mode-btn { margin-top: 8px; padding: 10px 16px; }
            #mode-menu p { margin-bottom: 2px; }
        }
    </style>
</head>
<body>

<audio id="bgMusic" loop>
    <source src="1.mp3" type="audio/mpeg">
</audio>
<audio id="openSound">
    <source src="1.mp3" type="audio/mpeg">
</audio>

<div id="game-stage">
    <div class="ui" id="game-ui">
        <div style="color:#3498db;">MODE: <span id="mode-label">-</span></div>
        <div style="color:#f1c40f;">STAGE: <span id="level">1</span></div>
        <div>CHESTS: <span id="score">0</span> / <span id="target">5</span></div>
        <div style="color:#e74c3c;">LIVES: <span id="lives">❤❤❤</span></div>
        <div style="color:#2ecc71;">STREAK: <span id="streak">0</span>/5</div>
    </div>
    <button id="next-lvl-btn" onclick="nextLevel()">NEXT LEVEL ▶</button>
    <div id="level-banner">
        <div id="banner-title">STAGE 1</div>
        <div class="sub" id="banner-sub">Click correct sentences!</div>
    </div>
    <div id="popup"></div>
</div>

<!-- Меню выбора режима -->
<div id="mode-menu">
    <h1>⛏ PRESENT SIMPLE MINER</h1>
    <p>Выбери, что тренировать:</p>
    <button class="mode-btn" onclick="startGame('aff')">＋ AFFIRMATIVE (He plays)</button>
    <button class="mode-btn" onclick="startGame('neg')">－ NEGATIVE (He doesn't play)</button>
    <button class="mode-btn" onclick="startGame('q')">？ QUESTIONS (Does he play?)</button>
    <button class="mode-btn" onclick="startGame('mix')">★ ALL TYPES (MIX)</button>
</div>

<div id="game-over" class="win-screen" style="background: rgba(0,0,0,0.9);">
    <h1 style="color:#ff5555;">GAME OVER 💥</h1>
    <button onclick="location.reload()">TRY AGAIN</button>
</div>

<div id="final-win" class="win-screen">
    <h1>YOU DEFEATED THE DRAGON! 🐉</h1>
    <button onclick="location.reload()">PLAY AGAIN</button>
</div>

<script>
    const stage    = document.getElementById('game-stage');
    const scoreEl  = document.getElementById('score');
    const livesEl  = document.getElementById('lives');
    const levelEl  = document.getElementById('level');
    const targetEl = document.getElementById('target');
    const nextBtn  = document.getElementById('next-lvl-btn');
    const winScreen= document.getElementById('final-win');
    const bgMusic  = document.getElementById('bgMusic');
    const openSound= document.getElementById('openSound');
    const banner   = document.getElementById('level-banner');
    const bannerTitle = document.getElementById('banner-title');
    const bannerSub   = document.getElementById('banner-sub');
    const modeMenu = document.getElementById('mode-menu');
    const modeLabel= document.getElementById('mode-label');
    const streakEl = document.getElementById('streak');
    const popupEl  = document.getElementById('popup');
    const gameOverEl = document.getElementById('game-over');

    let score = 0, lives = 3, currentLevel = 1, streak = 0;
    const MAX_LIVES = 5;        // максимум жизней
    const STREAK_FOR_LIFE = 5;  // правильных подряд для +1 жизни
    const CHEST_LIFE = 7500;    // сколько мс сундук висит на экране
    const SPAWN_MS = 2000;      // как часто появляются сундуки
    let gameActive = false, musicStarted = false;
    let gameMode = 'mix'; // aff | neg | q | mix

    const levelTargets = [5, 8, 12, 16, 20, 25];
    const totalLevels  = 6;

    const MODE_NAMES = { aff: 'AFFIRMATIVE', neg: 'NEGATIVE', q: 'QUESTIONS', mix: 'ALL TYPES' };
    const MODE_HINTS = {
        aff: 'Click correct sentences!',
        neg: 'Find correct NEGATIVE sentences!',
        q:   'Find correct QUESTIONS!',
        mix: 'Statements, negatives, questions!'
    };

    // ─── ЖИЗНИ ────────────────────────────────────────────────────────────────
    function renderLives() { livesEl.textContent = '❤'.repeat(Math.max(lives, 0)); }

    function showPopup(text) {
        popupEl.textContent = text;
        popupEl.classList.remove('show');
        void popupEl.offsetWidth;
        popupEl.classList.add('show');
    }

    function gainLife(reason) {
        if (lives < MAX_LIVES) {
            lives++; renderLives();
            showPopup(reason + ' +1 ❤');
        } else {
            showPopup(reason + ' (MAX ❤)');
        }
    }

    function addStreak() {
        streak++;
        if (streak >= STREAK_FOR_LIFE) { streak = 0; gainLife(STREAK_FOR_LIFE + ' IN A ROW!'); }
        streakEl.textContent = streak;
    }

    function startMusic() {
        if (!musicStarted) {
            bgMusic.volume = 0.25; bgMusic.play().catch(() => {}); musicStarted = true;
        }
    }

    function playOpenEffect() {
        openSound.currentTime = 0.5;
        openSound.volume = 0.15;
        openSound.play().catch(() => {});
        setTimeout(() => openSound.pause(), 300);
    }

    // ─── ГЕНЕРАТОР ФРАЗ ───────────────────────────────────────────────────────
    // [основная форма, форма с -s/-es/-ies, остаток предложения, 'a' = подходит и для IT]
    const verbs = [
        ['wake',  'wakes',  'up',            ''],
        ['listen','listens','to music',      ''],
        ['play',  'plays',  '',              'a'],
        ['watch', 'watches','TV',            ''],
        ['jump',  'jumps',  '',              'a'],
        ['swim',  'swims',  '',              'a'],
        ['catch', 'catches','the bus',       ''],
        ['do',    'does',   'homework',      ''],
        ['go',    'goes',   'to school',     ''],
        ['walk',  'walks',  'to school',     ''],
        ['get',   'gets',   'up early',      ''],
        ['take',  'takes',  'a shower',      ''],
        ['read',  'reads',  'a book',        ''],
        ['ride',  'rides',  'a bike',        ''],
        ['cook',  'cooks',  'dinner',        ''],
        ['have',  'has',    'a tail',        'a'],
        ['fly',   'flies',  'a kite',        ''],
        ['run',   'runs',   'fast',          'a'],
        ['climb', 'climbs', 'a tree',        'a'],
        ['eat',   'eats',   'breakfast',     ''],
        ['make',  'makes',  'the bed',       ''],
        ['throw', 'throws', 'the ball',      ''],
        ['wear',  'wears',  'a coat',        ''],
        ['like',  'likes',  'pizza',         ''],
        ['study', 'studies','English',       ''],
        ['draw',  'draws',  'pictures',      ''],
        ['sing',  'sings',  'songs',         ''],
        ['drink', 'drinks', 'milk',          ''],
        ['write', 'writes', 'letters',       ''],
        ['sleep', 'sleeps', 'at night',      'a'],
    ];
    const subjects3 = ['HE', 'SHE', 'IT'];
    const subjectsPl = ['I', 'YOU', 'WE', 'THEY'];

    const pick = arr => arr[Math.floor(Math.random() * arr.length)];
    const join = (...p) => p.filter(Boolean).join(' ').toUpperCase();

    function makePhrase() {
        const type = gameMode === 'mix' ? pick(['aff', 'neg', 'q']) : gameMode;
        const v = pick(verbs);
        const [base, third, rest, canIt] = v;
        let subjPool = [...subjectsPl, 'HE', 'SHE'];
        if (canIt) subjPool.push('IT');
        const S = pick(subjPool);
        const s3 = subjects3.includes(S);
        const correct = Math.random() < 0.5;
        let text;

        if (type === 'aff') {
            text = correct ? join(S, s3 ? third : base, rest)
                           : join(S, s3 ? base : third, rest);
        } else if (type === 'neg') {
            if (correct) {
                text = join(S, s3 ? "doesn't" : "don't", base, rest);
            } else {
                text = pick(s3
                    ? [join(S, "don't", base, rest), join(S, "doesn't", third, rest)]
                    : [join(S, "doesn't", base, rest), join(S, "don't", third, rest)]);
            }
        } else { // вопрос
            if (correct) {
                text = join(s3 ? 'does' : 'do', S, base, rest) + '?';
            } else {
                text = pick(s3
                    ? [join('do', S, base, rest), join('does', S, third, rest)]
                    : [join('does', S, base, rest), join('do', S, third, rest)]) + '?';
            }
        }
        return { text, correct };
    }

    // ─── ПОЗИЦИОНИРОВАНИЕ ─────────────────────────────────────────────────────
    const CHEST_W = () => {
        const w = window.innerWidth, h = window.innerHeight;
        const size = w < h ? Math.max(110, Math.min(200, w * 0.3))     // портрет (телефон)
                           : Math.max(120, Math.min(220, w * 0.18));   // ландшафт / десктоп
        return Math.min(size, h * 0.38);
    };
    function applySize() { document.documentElement.style.setProperty('--cw', CHEST_W() + 'px'); }
    applySize();
    window.addEventListener('resize', applySize);

    function isOverlapping(x, y) {
        const cw = CHEST_W();
        for (let c of document.querySelectorAll('.chest')) {
            const r = c.getBoundingClientRect();
            if (Math.hypot(r.left - x, r.top - y) < cw + 30) return true;
        }
        return false;
    }

    // ─── СОЗДАНИЕ СУНДУКА ─────────────────────────────────────────────────────
    function createChest() {
        if (!gameActive || lives <= 0) return;
        const cw = CHEST_W();
        const uiR  = document.getElementById('game-ui').getBoundingClientRect();
        const minY = uiR.bottom + 8;
        const maxY = Math.min(window.innerHeight - cw - 10, window.innerHeight * 0.8);

        let x, y, attempts = 0;
        do {
            x = Math.random() * Math.max(10, window.innerWidth - cw - 20) + 10;
            y = minY + Math.random() * Math.max(10, maxY - minY);
            attempts++;
        } while (isOverlapping(x, y) && attempts < 20);

        const chest = document.createElement('div');
        const data  = makePhrase();

        chest.className = 'chest';
        chest.style.left = x + 'px';
        chest.style.top  = y + 'px';
        chest.innerHTML  = `<div class="chest-text">${data.text}</div>`;

        let used = false;
        const handleClick = e => {
            if (e) e.preventDefault();
            if (used) return;
            startMusic();
            if (!gameActive) return;
            used = true;
            if (data.correct) {
                playOpenEffect();
                score++;
                scoreEl.innerText = score;
                chest.remove();
                addStreak();
                checkLevelObjective();
            } else {
                streak = 0; streakEl.textContent = 0;
                explode(chest);
            }
        };

        // pointerdown работает одинаково для мыши, пальца и стилуса
        chest.addEventListener('pointerdown', handleClick);
        chest.style.setProperty('--life', CHEST_LIFE + 'ms');

        stage.appendChild(chest);
        setTimeout(() => { if (chest.parentNode) chest.remove(); }, CHEST_LIFE);
    }

    // ─── ВЗРЫВ ────────────────────────────────────────────────────────────────
    function explode(el) {
        lives--;
        renderLives();
        if (lives <= 0) gameActive = false;
        el.innerHTML = '';
        el.classList.add('tnt-explosion');
        stage.classList.add('shake-screen');
        setTimeout(() => {
            stage.classList.remove('shake-screen');
            el.remove();
            if (lives <= 0) { gameOverEl.style.display = 'flex'; }
        }, 600);
    }

    // ─── ПРОВЕРКА ЦЕЛИ УРОВНЯ ─────────────────────────────────────────────────
    function checkLevelObjective() {
        if (score >= levelTargets[currentLevel - 1]) {
            gameActive = false;
            document.querySelectorAll('.chest').forEach(c => c.remove());
            if (currentLevel >= totalLevels) {
                winScreen.style.display = 'flex';
                document.getElementById('game-ui').style.display = 'none';
            } else {
                nextBtn.style.display = 'block';
                gainLife('LEVEL CLEAR!');
            }
        }
    }

    // ─── СЛЕДУЮЩИЙ УРОВЕНЬ ────────────────────────────────────────────────────
    function nextLevel() {
        nextBtn.style.display = 'none';
        currentLevel++;
        if (currentLevel > totalLevels) {
            winScreen.style.display = 'flex';
            document.getElementById('game-ui').style.display = 'none';
            return;
        }
        bannerTitle.textContent = `STAGE ${currentLevel}`;
        bannerSub.textContent   = `Collect ${levelTargets[currentLevel-1]} chests!`;
        banner.classList.add('show');

        setTimeout(() => {
            banner.classList.remove('show');
            stage.style.backgroundImage = `url('img/bg${currentLevel}.jpg')`;
            score = 0;
            scoreEl.innerText = score;
            levelEl.innerText = currentLevel;
            targetEl.innerText = levelTargets[currentLevel - 1];
            gameActive = true;
        }, 1800);
    }

    // ─── СТАРТ ИГРЫ ПОСЛЕ ВЫБОРА РЕЖИМА ───────────────────────────────────────
    function startGame(mode) {
        gameMode = mode;
        modeLabel.textContent = MODE_NAMES[mode];
        modeMenu.style.display = 'none';
        startMusic();

        targetEl.innerText = levelTargets[0];
        bannerTitle.textContent = 'STAGE 1';
        bannerSub.textContent   = MODE_HINTS[mode];
        banner.classList.add('show');
        setTimeout(() => {
            banner.classList.remove('show');
            gameActive = true;
        }, 1800);
    }

    document.addEventListener('contextmenu', e => e.preventDefault());
    setInterval(createChest, SPAWN_MS);
</script>
</body>
</html>
